{% extends "base.html" %}

{% block title %}משימות - FlyFit Manager{% endblock %}

{% block content %}
        <section class="card">
            <h2>➕ הוספת משימה</h2>
            <button type="button" id="cat-creator-toggle" class="icon-btn text-btn">+ קטגוריה חדשה</button>
            <form id="cat-creator-form" class="inline-form" hidden>
                <input id="cat-creator-input" type="text" placeholder="שם הקטגוריה">
                <button type="submit">צור קטגוריה</button>
            </form>

            <form id="add-task-form" class="task-form">
                <input id="task-title" type="text" placeholder="כותרת המשימה *" required>
                <select id="task-category">
                    <option value="">(ללא קטגוריה)</option>
                    {% for c in categories %}
                    <option value="{{ c.id }}">{{ c.name }}</option>
                    {% endfor %}
                </select>
                <input id="task-date" type="date" value="{{ today }}" required>
                <input id="task-time" type="time">
                <input id="task-notes" type="text" placeholder="הערות">
                <button type="submit">הוסף משימה</button>
            </form>
        </section>

        <section class="card">
            <h2>סינון</h2>
            <form id="filter-form" class="task-form">
                <label>מתאריך <input id="filter-date-from" type="date"></label>
                <label>עד תאריך <input id="filter-date-to" type="date"></label>
                <select id="filter-category">
                    <option value="">(הכל)</option>
                    {% for c in categories %}
                    <option value="{{ c.id }}">{{ c.name }}</option>
                    {% endfor %}
                </select>
                <button type="submit">סינון</button>
                <button type="button" id="filter-clear">נקה סינון</button>
            </form>
        </section>

        <section class="card">
            <h2 id="tasks-count">רשימת משימות</h2>
            <div id="tasks-by-date"></div>
            <p id="tasks-empty" class="empty-note" hidden>לא נמצאו משימות</p>
        </section>
{% endblock %}

{% block extra_scripts %}
    <script src="{{ url_for('static', filename='js/tasks.js') }}"></script>
{% endblock %}
