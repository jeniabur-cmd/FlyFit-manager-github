<!doctype html>
<html lang="he" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}FlyFit Manager{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header class="topbar">
        <h1>🗓️ FlyFit Manager</h1>
        <nav class="main-nav">
            <a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint == 'index' else '' }}">בית</a>
            <a href="{{ url_for('tasks_page') }}" class="{{ 'active' if request.endpoint == 'tasks_page' else '' }}">משימות</a>
            <a href="{{ url_for('templates_page') }}" class="{{ 'active' if request.endpoint == 'templates_page' else '' }}">תבניות</a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/common.js') }}"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
